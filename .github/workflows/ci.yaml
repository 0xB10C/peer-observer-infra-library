name: CI

on:
  push:
    branches: [master]
  # To be able to trigger a rebuild manually by (un)assigning someone
  # https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#pull_request
  pull_request:
    types: [opened, reopened, synchronize, assigned, unassigned]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  nix-fmt:
    name: nix fmt
    runs-on: ubuntu-slim
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          determinate: false
          extra-conf: |
            extra-substituters = https://b10c-nixpkgs.cachix.org
            extra-trusted-public-keys = b10c-nixpkgs.cachix.org-1:okaPyE6H0JAJb4H1J8r7mnf7Gst+0c6Djz7ff3QDGkY=

      - name: Show Nix version
        run: nix --version

      - name: Check formatting with nix fmt
        run: |
          nix fmt -- --ci

  nix-check:
    name: nix flake check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Optional: set this repository secret (and create a matching Cachix cache,
      # see CACHIX_CACHE below) to also push the packages we build ourselves --
      # mainly our custom bitcoind -- to a binary cache. Without it, CI still
      # pulls the b10c-nix packages from b10c-nixpkgs.cachix.org, but rebuilds
      # bitcoind from source on every run.
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
      CACHIX_CACHE: peer-observer
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          # We don't use Determinate Nix / FlakeHub. Leaving this on makes the
          # installer attempt (and fail) a FlakeHub login on every run.
          determinate: false
          # The b10c-nix packages (peer-observer, fork-observer, addrman-observer,
          # samply) are prebuilt and pushed to this cache by
          # https://github.com/0xb10c/nix. Without it we recompile all of them on
          # every CI run, which is most of the CI runtime.
          extra-conf: |
            extra-substituters = https://b10c-nixpkgs.cachix.org
            extra-trusted-public-keys = b10c-nixpkgs.cachix.org-1:okaPyE6H0JAJb4H1J8r7mnf7Gst+0c6Djz7ff3QDGkY=

      # Our custom bitcoind (pkgs/bitcoind) is only built here, so nobody else can
      # populate a cache with it. Push it from master and pull it in pull requests.
      # Skipped when CACHIX_AUTH_TOKEN isn't set, which includes pull requests from
      # forks, as those don't get repository secrets.
      - name: Setup cachix
        if: env.CACHIX_AUTH_TOKEN != ''
        uses: cachix/cachix-action@v17
        with:
          name: ${{ env.CACHIX_CACHE }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ github.event_name == 'pull_request' }}

      - name: Show Nix version
        run: nix --version

      - run: df -h
      - name: free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a
      - run: df -h

      - name: Run nix flake check
        run: nix flake check --print-build-logs --show-trace
