# Verifies that the starter template (templates/basic/) produces valid NixOS VMs.
#
# Simulates what a new user would do: initialises a fresh project from the
# template, rewrites the flake input to point at the PR's code (instead of
# the published master branch), then builds a VM for every host defined in the
# template's infra.nix.  If any module change in the PR breaks the template,
# this job fails.
name: flake template check

on:
  push:
    branches: [master]
  # To be able to trigger a rebuild manually by (un)assigning someone
  # https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#pull_request
  pull_request:
    types: [opened, reopened, synchronize, assigned, unassigned]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  template-check:
    name: init default template and check it
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # See the comment in ci.yaml. Optional: without it we just don't push.
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
      CACHIX_CACHE: peer-observer
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          determinate: false
          extra-conf: |
            extra-substituters = https://b10c-nixpkgs.cachix.org
            extra-trusted-public-keys = b10c-nixpkgs.cachix.org-1:okaPyE6H0JAJb4H1J8r7mnf7Gst+0c6Djz7ff3QDGkY=

      - name: Setup cachix
        if: env.CACHIX_AUTH_TOKEN != ''
        uses: cachix/cachix-action@v17
        with:
          name: ${{ env.CACHIX_CACHE }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ github.event_name == 'pull_request' }}

      - name: Show Nix version
        run: nix --version

      - name: Build host VMs for template nixosConfigurations
        run: |
          set -euxo pipefail
          FLAKE_DIR=$(pwd)

          DIR=$(mktemp -d)
          cd $DIR

          nix flake init --template path:$FLAKE_DIR/#basic

          # use the local flake, otherwise we'll test against the master-branch flake in PRs
          head flake.nix
          sed -i -e "s@github:peer-observer/infra-library@path:${FLAKE_DIR}@g" flake.nix
          head flake.nix

          git init
          git add .

          # Without pipefail a failing `nix flake show` would leave `hosts` empty
          # and the loop below would silently check nothing, passing the job.
          hosts=($(nix flake show --json | jq -r '.nixosConfigurations | keys[]'))
          if [ ${#hosts[@]} -eq 0 ]; then
            echo "no nixosConfigurations found in the template" >&2
            exit 1
          fi
          for host in "${hosts[@]}"
          do
            nix develop --command bash -c "build-vm $host"
          done
      - run: df -h
